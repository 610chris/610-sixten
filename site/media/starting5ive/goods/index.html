<style>
/* 合言葉フォーム（従来どおり） */
.gd-lock { min-height: 72vh; display: grid; place-items: center; padding: 120px 20px 60px; }
.gd-box { width: min(420px, 100%); padding: 36px 30px; border: 1px solid var(--line); background: var(--bg-card); text-align: center; }
.gd-box .gd-k { margin-bottom: 10px; }
.gd-box h1 { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.08em; margin: 0 0 8px; }
.gd-box p { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
.gd-box input { width: 100%; box-sizing: border-box; padding: 14px 16px; font-size: 18px; letter-spacing: 0.2em; text-align: center; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 8px; }
.gd-box input:focus { outline: 2px solid #ff7a1a; outline-offset: 1px; }
.gd-box button { margin-top: 14px; width: 100%; padding: 14px; font-family: var(--font-display); font-size: 14px; letter-spacing: 0.2em; background: #fff; color: #000; border: 0; border-radius: 8px; cursor: pointer; }
.gd-box button:disabled { opacity: .5; }
.gd-err { min-height: 1.4em; margin-top: 12px; font-size: 13px; color: #ff6b6b; }
.gd-box.shake { animation: gdShake .35s; }
@keyframes gdShake { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.gd-k { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.28em; color: #ff7a1a; margin: 0; }

/* Try the Look（復号後の中身・このページだけ白基調） */
.tl { background: #fff; color: #141414; padding: 104px 0 72px; min-height: 100vh; overflow: hidden; }
.tl [hidden] { display: none !important; }
.tl button { font: inherit; color: inherit; cursor: pointer; }
.tl-head { text-align: center; margin-bottom: 18px; }
.tl-k { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.34em; color: #ff7a1a; margin: 0; }
.tl-h { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.6vw, 42px); letter-spacing: 0.04em; line-height: 1.15; margin: 8px 0 6px; color: #141414; }
.tl-lead { font-size: 13px; color: #8a8a86; margin: 0; }

.tl-bar { position: absolute; left: 3%; right: 3%; top: 17px; height: 5px; border-radius: 3px; background: linear-gradient(#e2e2df, #a8a8a3); box-shadow: 0 2px 4px rgba(0,0,0,.10); z-index: 0; }
.tl-bar::before, .tl-bar::after { content: ""; position: absolute; top: -5px; width: 9px; height: 15px; border-radius: 3px; background: #b4b4af; }
.tl-bar::before { left: -6px; } .tl-bar::after { right: -6px; }

.tl-rack { position: relative; overflow: hidden; padding: 14px 0 26px; }
.tl-track { list-style: none; margin: 0; padding: 0 30px; display: flex; gap: clamp(16px, 3vw, 44px); width: max-content; position: relative; z-index: 1;
  animation: tlDrift var(--dur, 10s) ease-in-out infinite alternate; }
.tl-track.fit { margin: 0 auto; }
.tl-track > li { display: flex; }
.tl-rack:hover .tl-track { animation-play-state: paused; }
@keyframes tlDrift { from { transform: translateX(var(--from, 0px)); } to { transform: translateX(var(--to, 0px)); } }

.tl-item { appearance: none; background: none; border: 0; padding: 0; display: block; width: clamp(150px, 20vw, 250px); text-align: center; display: flex; flex-direction: column; transition: opacity .38s ease, transform .38s ease; -webkit-tap-highlight-color: transparent; }
.tl-item.gone { opacity: 0; transform: translateY(10px) scale(.96); pointer-events: none; }
.tl-item:focus-visible { outline: 2px solid #ff7a1a; outline-offset: 6px; border-radius: 6px; }
.tl-swing { position: relative; display: block; padding-top: 14.5%; transform-origin: 50% 2px; animation: tlSway 4.8s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes tlSway { from { transform: rotate(-1.8deg); } to { transform: rotate(1.8deg); } }
.tl-hanger { position: absolute; top: 0; left: 50%; width: 58%; height: auto; transform: translateX(-50%); z-index: 0; overflow: visible; }
.tl-swing img { position: relative; z-index: 1; display: block; width: 100%; height: auto; filter: drop-shadow(0 12px 14px rgba(0,0,0,.13)) drop-shadow(0 0 1px rgba(0,0,0,.18)); transition: transform .3s ease; }
.tl-item:hover .tl-swing img { transform: translateY(-4px); }
.tl-tag { display: block; margin-top: auto; padding-top: 14px; font-size: 13px; font-weight: 700; }
.tl-tag small, .tl-thumb-t small { display: block; font-size: 11px; font-weight: 500; color: #8a8a86; letter-spacing: 0.08em; }

.tl-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) 128px; gap: clamp(20px, 3vw, 44px); align-items: center; }
.tl-info { order: 1; } .tl-stagebox { order: 2; } .tl-thumbs { order: 3; }
.tl-stagebox { position: relative; display: flex; justify-content: center; padding-top: 14px; align-self: start; }
.tl-stagebox .tl-bar { left: 14%; right: 14%; }
.tl-main { position: relative; z-index: 1; width: min(100%, 430px); aspect-ratio: 900 / 1075; }
.tl-main .tl-swing { animation-duration: 6s; }
#tl-main-img { transform-origin: 50% 0; }
.tl-no { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.26em; color: #ff7a1a; margin: 0 0 6px; }
.tl-name { font-size: 28px; font-weight: 900; margin: 0 0 4px; color: #141414; }
.tl-color { font-size: 14px; color: #55554f; margin: 0 0 18px; }
.tl-spec { margin: 0 0 22px; display: grid; gap: 0; }
.tl-spec div { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 10px; font-size: 14px; border-top: 1px solid #e6e6e2; padding: 9px 0; }
.tl-spec div:last-child { border-bottom: 1px solid #e6e6e2; }
.tl-spec dt { color: #8a8a86; } .tl-spec dd { margin: 0; }
.tl-cart { display: block; width: 100%; padding: 15px; border: 0; border-radius: 999px; background: #141414; color: #fff !important; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; transition: background .2s; }
.tl-cart:hover { background: #ff7a1a; }
.tl-back { display: block; margin: 14px auto 0; padding: 8px 4px; background: none; border: 0; font-size: 13px; color: #6b6b66 !important; letter-spacing: 0.06em; }
.tl-back:hover { color: #141414 !important; }
.tl-thumbs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tl-thumb { appearance: none; display: block; width: 100%; padding: 0; background: none; border: 0; text-align: center; }
.tl-thumb-ph { display: grid; place-items: center; aspect-ratio: 4 / 3; background: #f5f5f3; border: 1px solid #e6e6e2; border-radius: 10px; padding: 6px; transition: border-color .2s, box-shadow .2s; }
.tl-thumb-ph img { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; min-height: 0; filter: drop-shadow(0 0 1px rgba(0,0,0,.25)); }
.tl-thumb[aria-pressed="true"] .tl-thumb-ph { border-color: #141414; box-shadow: inset 0 0 0 1px #141414; }
.tl-thumb:hover .tl-thumb-ph { border-color: #9a9a95; }
.tl-thumb-t { display: block; margin-top: 5px; font-size: 11px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.tl-detail.in .tl-info, .tl-detail.in .tl-thumbs, .tl-detail.in .tl-stagebox .tl-bar, .tl-detail.in .tl-main .tl-hanger { animation: tlUp .5s ease both; }
.tl-detail.in .tl-thumbs { animation-delay: .12s; } .tl-detail.in .tl-info { animation-delay: .2s; }
@keyframes tlUp { from { opacity: 0; transform: translateY(12px); } }
.tl-detail.in .tl-main .tl-hanger { animation-name: tlFade; }
@keyframes tlFade { from { opacity: 0; } }

.tl-modal { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: 20px; background: rgba(20,20,20,.45); opacity: 0; transition: opacity .25s ease; }
.tl-modal.in { opacity: 1; }
.tl-modal-box { width: min(380px, 100%); background: #fff; color: #141414; border-radius: 16px; padding: 30px 26px 24px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); transform: translateY(14px); transition: transform .3s ease; }
.tl-modal.in .tl-modal-box { transform: none; }
.tl-modal-box h3 { font-size: 21px; font-weight: 900; margin: 10px 0 6px; }
.tl-modal-box p { font-size: 14px; color: #55554f; margin: 0 0 8px; line-height: 1.7; }
.tl-modal-box .tl-modal-item { font-size: 13px; color: #8a8a86; }
.tl-modal-box button { margin-top: 12px; width: 100%; padding: 13px; border: 0; border-radius: 999px; background: #141414; color: #fff !important; font-weight: 700; }

@media (max-width: 760px) {
  .tl { padding-top: 92px; }
  .tl-rack { margin-inline: -24px; }
  .tl-detail { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .tl-stagebox { order: 1; } .tl-thumbs { order: 2; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } .tl-info { order: 3; }
  .tl-main { width: min(76%, 330px); }
  .tl-thumb-ph { aspect-ratio: 1 / 1; padding: 4px; }
  .tl-thumb-t { font-size: 10px; }
  .tl-name { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .tl-track, .tl-swing { animation: none !important; }
  .tl-rack { overflow-x: auto; }
  .tl-detail.in * { animation: none !important; }
}

<script>
(() => {
  // Try the Look の操作。innerHTML で中身を入れた直後に open() から呼ぶ（中身の script は動かないため）
  function initLook() {
    const root = document.getElementById('tl');
    if (!root || root.dataset.ready) return;
    root.dataset.ready = '1';
    const q = (s) => root.querySelector(s), qa = (s) => Array.from(root.querySelectorAll(s));
    const rack = q('#tl-rack'), track = q('#tl-track'), detail = q('#tl-detail'), lead = q('#tl-lead');
    const items = qa('.tl-item'), thumbs = qa('.tl-thumb'), mainImg = q('#tl-main-img');
    const modal = q('#tl-modal'), cart = q('#tl-cart'), closeBtn = q('#tl-modal-close');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const LEAD0 = lead.textContent, LEAD1 = 'ほかの色・アイテムに着替えられます';
    const data = items.map((el) => { const im = el.querySelector('img'); return { no: el.dataset.no, name: el.dataset.name, color: el.dataset.color, src: im.src, w: im.getAttribute('width'), h: im.getAttribute('height') }; });
    let cur = -1, busy = false;

    function drift() {
      track.classList.remove('fit');
      track.style.animation = 'none';
      const over = track.scrollWidth - rack.clientWidth;
      if (over > 0) { track.style.setProperty('--from', '0px'); track.style.setProperty('--to', -over + 'px'); track.style.setProperty('--dur', Math.max(12, over / 22) + 's'); }
      else { track.classList.add('fit'); track.style.setProperty('--from', '-28px'); track.style.setProperty('--to', '28px'); track.style.setProperty('--dur', '9s'); }
      void track.offsetWidth;
      track.style.animation = '';
    }

    function fill(i) {
      const d = data[i];
      mainImg.src = d.src; mainImg.width = d.w; mainImg.height = d.h; mainImg.alt = d.name + '（' + d.color + '）';
      q('#tl-no').textContent = d.no; q('#tl-name').textContent = d.name; q('#tl-color').textContent = d.color;
      thumbs.forEach((t, j) => t.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
      cur = i;
    }

    function show(i) {
      if (i === cur) return;
      if (reduce || !mainImg.animate) { fill(i); return; }
      mainImg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, easing: 'ease-in' }).finished.then(() => {
        fill(i);
        mainImg.animate([{ opacity: 0, transform: 'rotate(-3deg) translateY(-8px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.75,.2,1)' });
      });
    }

    function pick(i) {
      if (busy || !detail.hidden) return;
      busy = true;
      const r0 = items[i].querySelector('img').getBoundingClientRect(), y0 = scrollY;
      items.forEach((el, j) => { if (j !== i) el.classList.add('gone'); });
      track.style.animationPlayState = 'paused';
      setTimeout(() => {
        rack.hidden = true; detail.hidden = false; lead.textContent = LEAD1;
        fill(i);
        detail.classList.remove('in'); void detail.offsetWidth; detail.classList.add('in');
        const navH = 70, top = mainImg.getBoundingClientRect().top;
        if (top < navH) scrollBy({ top: top - navH - 16, behavior: 'instant' });
        const r1 = mainImg.getBoundingClientRect(), dy0 = scrollY - y0;
        if (!reduce && mainImg.animate && r1.width) {
          const s = r0.width / r1.width;
          const dx = (r0.left + r0.width / 2) - (r1.left + r1.width / 2);
          const dy = (r0.top - dy0) - r1.top;
          mainImg.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' }, { transform: 'none' }], { duration: 620, easing: 'cubic-bezier(.2,.75,.2,1)' });
        }
        busy = false;
      }, reduce ? 0 : 380);
    }

    function back() {
      closeModal(true);
      detail.hidden = true; rack.hidden = false; lead.textContent = LEAD0;
      track.style.animationPlayState = '';
      items.forEach((el) => el.classList.add('gone'));
      drift();
      requestAnimationFrame(() => requestAnimationFrame(() => items.forEach((el, j) => { el.style.transitionDelay = (j * 70) + 'ms'; el.classList.remove('gone'); })));
      setTimeout(() => items.forEach((el) => { el.style.transitionDelay = ''; }), 900);
      const t = root.getBoundingClientRect().top + scrollY;
      if (scrollY > t) scrollTo({ top: t, behavior: 'instant' });
      cur = -1;
    }

    function openModal() {
      if (cur < 0) return;
      q('#tl-modal-item').textContent = data[cur].name + '／' + data[cur].color;
      modal.hidden = false;
      requestAnimationFrame(() => modal.classList.add('in'));
      closeBtn.focus();
    }
    function closeModal(silent) {
      if (modal.hidden) return;
      modal.classList.remove('in'); modal.hidden = true;
      if (!silent) cart.focus();
    }

    thumbs.forEach((t, i) => { t.querySelector('img').src = data[i].src; t.addEventListener('click', () => show(i)); });
    items.forEach((el, i) => el.addEventListener('click', () => pick(i)));
    q('#tl-back').addEventListener('click', back);
    cart.addEventListener('click', openModal);
    closeBtn.addEventListener('click', () => closeModal());
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!rack.hidden) drift(); }, 150); });
    drift();
  }

  const D = JSON.parse(document.getElementById('gd-data').textContent);
  const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY = 's5GoodsPw';
  async function open(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.i) }, key, u8(D.c));
    document.getElementById('gd-main').innerHTML = new TextDecoder().decode(buf);
    document.title = 'GOODS｜STARTING 5IVE | 610 — sixten';
    try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    scrollTo({ top: 0, behavior: 'instant' });
    try { initLook(); } catch (e) { console.error(e); } // 初期化の失敗を「合言葉が違います」にしない
  }
  const form = document.getElementById('gd-form'), pw = document.getElementById('gd-pw'), btn = document.getElementById('gd-btn'), err = document.getElementById('gd-err');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; err.textContent = '';
    try { await open(pw.value.trim()); }
    catch (x) {
      err.textContent = !window.crypto || !crypto.subtle ? 'このブラウザでは開けません' : '合言葉が違います';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      pw.select(); btn.disabled = false;
    }
  });
  let saved = null; try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) open(saved).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} });
})();
</script>
</body>
