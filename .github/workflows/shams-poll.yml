name: Shams poll
# NBAインサイダー3人 (Shams Charania / Chris Haynes / Michael Scotto) の nitter RSS を
# 軽量ポーリングし、新着（リプライ/RT除く）が各既読ファイル
# (seen_shams.txt / seen_haynes.txt / seen_scotto.txt) に無ければ
# journal_auto/shams_signal.txt を更新して push する。
# (2026-08-19 Haynes/Scotto追加。ファイル名・シグナル名は既存webhook連携を崩さないため据え置き)この push イベントを claude.ai の webhook トリガーが受けて、
# クラウドルーチン「610 JOURNAL 自動記事化」を即時起動する（記事化はルーチン側の仕事）。
# ルーチンはチェックした新着を必ず seen_shams.txt に追記して push するので、
# ここの判定は次回ポーリングで自然に収束する（毎時ルーチンはフォールバックとして併走）。
# ループ安全性: ルーチンは候補ゼロなら commit しない＝push しない＝再発火しないため自己終息する。
# 注: GITHUB_TOKEN の push は他の Actions (deploy.yml) を起動しない仕様（GitHubの再帰防止）。
#     shams_signal.txt はサイト外ファイルなのでデプロイ不要＝この仕様で問題ない。
# 間隔: リポジトリはpublic(2026-08-17クリス決定)なのでActionsは無料無制限。5分間隔で常時ポーリング。
# (実際のGitHub schedulerは負荷次第で5〜15分程度に遅延することがある)
# ⚠️ privateに戻す場合は無料枠2,000分/月に収まらないため間隔の再設計が必要。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'true で新着判定を無視して空commitをpush（疎通テスト用）'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: shams-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: journal_auto
      - name: Check for new insider posts
        id: check
        run: |
          echo "new=false" >> "$GITHUB_OUTPUT"
          # 3人分を順に取得（nitterのレート制限を避けるため間隔を空ける）。
          # 取れなかった人はそのポーリング回だけスキップ（次回に自然に回収される）
          ok=0
          for h in ShamsCharania ChrisBHaynes MikeAScotto; do
            if curl -sf --max-time 45 -A 'Mozilla/5.0' "https://nitter.net/$h/rss" -o "/tmp/$h.rss"; then
              ok=$((ok+1))
            else
              echo "RSS fetch failed for $h — skip this handle"
              rm -f "/tmp/$h.rss"
            fi
            sleep 5
          done
          if [ "$ok" = "0" ]; then
            echo "all RSS fetches failed — skip this run"
            exit 0
          fi
          python3 - <<'EOF'
          import html, os, re
          FEEDS = [
              ('ShamsCharania', 'journal_auto/seen_shams.txt'),
              ('ChrisBHaynes', 'journal_auto/seen_haynes.txt'),
              ('MikeAScotto', 'journal_auto/seen_scotto.txt'),
          ]
          new = []
          for handle, seen_file in FEEDS:
              try:
                  rss = open(f'/tmp/{handle}.rss', encoding='utf-8').read()
              except FileNotFoundError:
                  continue
              try:
                  seen = {l.strip() for l in open(seen_file) if l.strip()}
              except FileNotFoundError:
                  seen = set()
              for item in re.findall(r'<item>.*?</item>', rss, re.S):
                  t = re.search(r'<title>(.*?)</title>', item, re.S)
                  l = re.search(r'<link>(.*?)</link>', item, re.S)
                  if not t or not l:
                      continue
                  title = html.unescape(t.group(1)).strip()
                  # ルーチン側 §1b の除外と同じ決定的フィルタ（リプライ/RT）
                  if title.startswith('R to ') or title.startswith('RT by'):
                      continue
                  m = re.search(r'/status/(\d+)', l.group(1))
                  if not m:
                      continue
                  url = f'https://x.com/{handle}/status/{m.group(1)}'
                  if url not in seen:
                      new.append(url)
          print(f'new posts: {len(new)}')
          for u in new:
              print(' ', u)
          with open('/tmp/new_shams.txt', 'w') as f:
              f.writelines(u + '\n' for u in new)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new={'true' if new else 'false'}\n")
          EOF
      - name: Signal via push
        if: steps.check.outputs.new == 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name "shams-poll"
          git config user.email "actions@github.com"
          if [ "${{ github.event.inputs.force }}" = "true" ] && [ "${{ steps.check.outputs.new }}" != "true" ]; then
            git commit --allow-empty -m "shams-poll: 疎通テスト(force)"
          else
            cp /tmp/new_shams.txt journal_auto/shams_signal.txt
            git add journal_auto/shams_signal.txt
            if git diff --cached --quiet; then
              echo "signal unchanged — 前回シグナルが未処理のまま。毎時ルーチンに任せてスキップ"
              exit 0
            fi
            git commit -m "shams-poll: インサイダー新着シグナル"
          fi
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
