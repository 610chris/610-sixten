name: Shams poll
# Shams Charania (@ShamsCharania) の nitter RSS を軽量ポーリングし、
# 新着（リプライ/RT除く）が seen_shams.txt に無ければ journal_auto/shams_signal.txt を
# 更新して push する。この push イベントを claude.ai の webhook トリガーが受けて、
# クラウドルーチン「610 JOURNAL 自動記事化」を即時起動する（記事化はルーチン側の仕事）。
# ルーチンはチェックした新着を必ず seen_shams.txt に追記して push するので、
# ここの判定は次回ポーリングで自然に収束する（毎時ルーチンはフォールバックとして併走）。
# ループ安全性: ルーチンは候補ゼロなら commit しない＝push しない＝再発火しないため自己終息する。
# 注: GITHUB_TOKEN の push は他の Actions (deploy.yml) を起動しない仕様（GitHubの再帰防止）。
#     shams_signal.txt はサイト外ファイルなのでデプロイ不要＝この仕様で問題ない。
# ⚠️ 間隔の設計（privateリポジトリのActions無料枠2,000分/月・1ジョブ=最低1分課金）:
#   ピーク帯(NBA速報が集中する米国日中〜深夜 = UTC 16:00-06:59)は20分間隔 = 45回/日
#   オフピーク(UTC 07:00-15:59 = 日本の夕方〜夜)は毎時15分 = 9回/日
#   計54回/日 ≈ 月1,674分 + deploy分 → 無料枠内。
#   リポジトリをpublicにすればActionsは無制限無料になるので '*/5 * * * *' 1本に戻してよい。
on:
  schedule:
    - cron: '*/20 0-6,16-23 * * *'
    - cron: '15 7-15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'true で新着判定を無視して空commitをpush（疎通テスト用）'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: shams-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: journal_auto
      - name: Check for new Shams posts
        id: check
        run: |
          echo "new=false" >> "$GITHUB_OUTPUT"
          if ! curl -sf --max-time 45 -A 'Mozilla/5.0' https://nitter.net/ShamsCharania/rss -o /tmp/shams.rss; then
            echo "RSS fetch failed — skip this run"
            exit 0
          fi
          python3 - <<'EOF'
          import html, os, re
          rss = open('/tmp/shams.rss', encoding='utf-8').read()
          try:
              seen = {l.strip() for l in open('journal_auto/seen_shams.txt') if l.strip()}
          except FileNotFoundError:
              seen = set()
          new = []
          for item in re.findall(r'<item>.*?</item>', rss, re.S):
              t = re.search(r'<title>(.*?)</title>', item, re.S)
              l = re.search(r'<link>(.*?)</link>', item, re.S)
              if not t or not l:
                  continue
              title = html.unescape(t.group(1)).strip()
              # ルーチン側 §1b の除外と同じ決定的フィルタ（リプライ/RT）
              if title.startswith('R to ') or title.startswith('RT by'):
                  continue
              m = re.search(r'/status/(\d+)', l.group(1))
              if not m:
                  continue
              url = f'https://x.com/ShamsCharania/status/{m.group(1)}'
              if url not in seen:
                  new.append(url)
          print(f'new posts: {len(new)}')
          for u in new:
              print(' ', u)
          with open('/tmp/new_shams.txt', 'w') as f:
              f.writelines(u + '\n' for u in new)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"new={'true' if new else 'false'}\n")
          EOF
      - name: Signal via push
        if: steps.check.outputs.new == 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name "shams-poll"
          git config user.email "actions@github.com"
          if [ "${{ github.event.inputs.force }}" = "true" ] && [ "${{ steps.check.outputs.new }}" != "true" ]; then
            git commit --allow-empty -m "shams-poll: 疎通テスト(force)"
          else
            cp /tmp/new_shams.txt journal_auto/shams_signal.txt
            git add journal_auto/shams_signal.txt
            if git diff --cached --quiet; then
              echo "signal unchanged — 前回シグナルが未処理のまま。毎時ルーチンに任せてスキップ"
              exit 0
            fi
            git commit -m "shams-poll: Shams新着シグナル"
          fi
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
