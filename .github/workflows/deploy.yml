name: Deploy to Surge
# mainにpushされるたび、site/ を両ドメインへデプロイする。
# ローカルからでもクラウドエージェントからでも、公開経路はこのActions一本。
on:
  push:
    branches: [main]
    # site/ に触れないpush(seen更新・shams_signal・workflow変更など)ではデプロイ不要なのでpathsで絞る。
    paths: ['site/**', 'journal_auto/build_seo.py', 'journal_auto/indexnow_ping.sh']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # SEO/AEO静的ビルド(2026-09-05): journal.js の記事台帳から一覧の静的HTML・関連記事・パンくず・
      # sitemap.xml・feed.xml・llms.txt を再生成。ルーチンが実行し忘れても公開物は常に最新になる保険。
      - name: Build SEO artifacts
        run: python3 journal_auto/build_seo.py
      - run: npm install -g surge
      - name: Deploy 610-sixten.surge.sh
        run: surge ./site 610-sixten.surge.sh
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      - name: Deploy sixten.jp
        run: surge ./site sixten.jp
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      # IndexNow(Bing/Yandex/Naver等)へ全URLを通知。Googleは非参加なのでSearch Consoleのsitemapで別途カバー。
      - name: Notify IndexNow
        run: bash journal_auto/indexnow_ping.sh
