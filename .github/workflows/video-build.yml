name: Video build
# 記事が IG キュー（journal_auto/ig_queue.json）に積まれたら、その記事の縦型ニュース動画（1080x1920）を
# journal_video/（Remotion）で書き出し、Release「videos」に置く。背景は該当選手の写真（journal_auto/video_input.py）。
# 2026-09-14 設置（クリス指示「俺は1つも動きたくない。完全自動で記事が作られる形がいいんだ」）。
# 書き出した動画はそのまま @sixten に IG リールとして自動投稿する（journal_auto/reel_post.py）。
# 2026-09-29 追加（クリス指定: 承認なしの全自動・リールだけ・Actions で投稿）。
# 記録（video_status.json）も Release 側に置くので、この workflow は commit/push しない＝他の起動を誘発しない。
# 深夜（JST 3:00〜6:59）にできた動画は reel_post.py が投稿を保留するので、7:00 の schedule で流す
# （2026-10-02 クリス指示「夜中の3時から朝7時までに起きたやつは全部朝7時に投稿」）。
on:
  push:
    branches: [main]
    paths:
      - journal_auto/ig_queue.json
  schedule:
    # UTC 22:00 = JST 7:00。Actions の cron は数分〜十数分遅れることがある
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: '記事番号（空白区切り・空なら未作成の記事すべて）'
        default: ''
      force:
        description: 'true で作成済みでも作り直す'
        default: 'false'
      post:
        description: 'false でリール投稿をしない（動画を作るだけ）'
        default: 'true'

permissions:
  contents: write
  actions: write   # 最後に deploy.yml を workflow_dispatch で起動するため

concurrency:
  group: video-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journal_video/package-lock.json
      - name: Install
        run: |
          pip install --quiet pillow numpy opencv-python-headless
          # 記事ページ用の軽量版（720x1280）を作るのに使う。ランナーに無ければ入れる。
          ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          cd journal_video && npm ci
      - name: Build videos
        # 7:00 の schedule は深夜に保留したぶんを投稿するだけ。動画は作らない
        if: ${{ github.event_name != 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python3 journal_auto/video_build.py ${{ github.event.inputs.ids }} $FORCE

      # 記事ページ用の軽量版の commit（2026-09-20〜）は 2026-10-29 に廃止。記事には動画を載せない。
      - name: Post reels
        # 動画が一部失敗しても、できた分は投稿する
        if: ${{ !cancelled() && github.event.inputs.post != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_ACCESS_TOKEN_KICKS: ${{ secrets.IG_TOKEN_KICKS }}
        # 7:00 の schedule 起動は静音時間を抜けた直後なので、深夜にたまったぶんを多めに出し切る
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 journal_auto/reel_post.py --ignore-quiet --max 12
          else
            python3 journal_auto/reel_post.py
          fi
